<svg viewBox="0 0 220 220" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="logoGrad" x1="0" y1="0" x2="220" y2="220" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#7B3FE4"/>
      <stop offset="30%" stop-color="#4F6BFF"/>
      <stop offset="65%" stop-color="#D93BAA"/>
      <stop offset="100%" stop-color="#EF3030"/>
    </linearGradient>
  </defs>
  <!-- Chimney -->
  <rect x="50" y="50" width="24" height="38" stroke="url(#logoGrad)" stroke-width="9" stroke-linejoin="round" fill="none"/>
  <!-- Roof -->
  <polyline points="18,107 110,36 202,107" stroke="url(#logoGrad)" stroke-width="9" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <!-- Walls: left side, bottom, right side -->
  <polyline points="33,107 33,188 187,188 187,107" stroke="url(#logoGrad)" stroke-width="9" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <!-- VORES -->
  <text x="110" y="141" text-anchor="middle" font-family="'Arial Black','Helvetica Neue','sans-serif'" font-weight="900" font-size="35" letter-spacing="-0.5" fill="#2A2A2A">VORES</text>
  <!-- HJEM -->
  <text x="110" y="178" text-anchor="middle" font-family="'Arial Black','Helvetica Neue','sans-serif'" font-weight="900" font-size="35" letter-spacing="-0.5" fill="#2A2A2A">HJEM</text>
</svg>
