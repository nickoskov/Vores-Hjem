plugins = []

[functions]

  [functions."*"]

[build]

  [build.environment]

  [build.processing]

    [build.processing.css]

    [build.processing.html]

    [build.processing.images]

    [build.processing.js]

  [build.services]

# Sikkerhedsheadere som på den tyske side (fund L64, 16. okt. 2026)
[[headers]]
for = "/*"

  [headers.values]
  X-Content-Type-Options = "nosniff"
  Referrer-Policy = "strict-origin-when-cross-origin"
  X-Frame-Options = "SAMEORIGIN"
  Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=()"

# Rodbilleder (screen-*.webp m.fl.) gemmes også en uge (fund L79)
[[headers]]
for = "/*.webp"

  [headers.values]
  Cache-Control = "public, max-age=604800"

[[headers]]
for = "/fonts/*"

  [headers.values]
  Cache-Control = "public, max-age=31536000, immutable"

# Billeder og video gemmes en uge i browseren, som paa den tyske side (16. okt. 2026)
[[headers]]
for = "/images/*"

  [headers.values]
  Cache-Control = "public, max-age=604800"

[[headers]]
for = "/video/*"

  [headers.values]
  Cache-Control = "public, max-age=604800"

