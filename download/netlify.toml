plugins = []

[functions]

  [functions."*"]

[build]
publish = "/Users/nickoskovgaard/voreshjem-hent"
publishOrigin = "default"

  [build.environment]

  [build.processing]

    [build.processing.css]

    [build.processing.html]

    [build.processing.images]

    [build.processing.js]

  [build.services]
# Netlify-adressen sender videre til domaenet, saa siden ikke findes to steder (16. okt. 2026)
[[redirects]]
from = "https://voreshjem-download.netlify.app/*"
to = "https://download.voreshjem.dk/:splat"
status = 301
force = true



# Sikkerhedsheadere som på den tyske side (fund L64, 16. okt. 2026)
[[headers]]
for = "/*"

  [headers.values]
  X-Content-Type-Options = "nosniff"
  Referrer-Policy = "strict-origin-when-cross-origin"
  X-Frame-Options = "DENY"
  Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=()"

# Skriften gemmes et år, som på www.voreshjem.dk og den tyske download-side (fund S54, 16. okt. 2026)
[[headers]]
for = "/fonts/*"

  [headers.values]
  Cache-Control = "public, max-age=31536000, immutable"

# Billeder og video gemmes en uge (fund L79)
[[headers]]
for = "/*.mp4"

  [headers.values]
  Cache-Control = "public, max-age=604800"

[[headers]]
for = "/*.webp"

  [headers.values]
  Cache-Control = "public, max-age=604800"

[[headers]]
for = "/*.png"

  [headers.values]
  Cache-Control = "public, max-age=604800"

