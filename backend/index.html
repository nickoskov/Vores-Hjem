<!DOCTYPE html>
<html lang="da">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Vores Hjem, backend</title>
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" type="image/png" href="/images/logo.png">
<link rel="apple-touch-icon" href="/images/logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
:root{
  --lilla:#6C47FF; --lilla-lys:#8B6AFF; --blaa:#3B82F6; --pink:#EC4899;
  --groen:#10B981; --roed:#EF4444; --gul:#F59E0B;
  --gradient:linear-gradient(135deg,#6C47FF 0%,#3B82F6 55%,#EC4899 100%);
  --bg:#F7F6FC; --kort:#FFF; --kant:#E8E5F5; --kant-blod:#F1EFFA;
  --blaek:#14132A; --daemp:#6B6785; --svag:#9B97B5;
  --skygge:0 1px 2px rgba(20,19,42,.04), 0 6px 20px rgba(108,71,255,.05);
  --r:14px; --font:'Plus Jakarta Sans',system-ui,sans-serif;
}
body{font-family:var(--font);background:var(--bg);color:var(--blaek);-webkit-font-smoothing:antialiased;line-height:1.5}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:none;background:none}
a{color:inherit;text-decoration:none}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:#DDD8F0;border-radius:6px;border:3px solid var(--bg)}

/* ── login ── */
#login{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;
  background:var(--gradient);z-index:100;padding:24px}
#login .boks{background:#fff;border-radius:22px;padding:40px;width:100%;max-width:400px;
  box-shadow:0 30px 80px rgba(20,19,42,.28);text-align:center}
#login h1{font-size:24px;font-weight:800;letter-spacing:-.02em}
#login p{color:var(--daemp);font-size:14px;margin-top:6px}
#login input{width:100%;margin-top:24px;padding:14px 16px;border:1.5px solid var(--kant);
  border-radius:12px;font-size:15px;outline:none;transition:border-color .15s}
#login input:focus{border-color:var(--lilla)}
#login button{width:100%;margin-top:12px;padding:14px;border-radius:12px;
  background:var(--gradient);color:#fff;font-weight:700;font-size:15px}
#login .fejl{margin-top:14px;color:var(--roed);font-size:13.5px;font-weight:600;min-height:20px}

/* ── ramme ── */
#app{display:none;min-height:100vh}
#app.vis{display:grid;grid-template-columns:250px 1fr}
aside{background:#fff;border-right:1px solid var(--kant);padding:20px 14px;
  display:flex;flex-direction:column;position:sticky;top:0;height:100vh;
  overflow-y:auto;overscroll-behavior:contain;scrollbar-width:thin}
aside > *{flex-shrink:0}
/* lave skaerme: menuen rykkes lidt sammen, saa mere kan ses uden at scrolle */
@media (min-width:861px) and (max-height:860px){
  aside{padding:14px 12px}
  nav button{padding:7px 12px}
  .nav-mrk{padding:10px 12px 4px}
  .mrk{padding-bottom:12px}
}
.mrk{display:flex;align-items:center;gap:10px;padding:0 10px 18px}
.mrk .prik{width:32px;height:32px;border-radius:9px;background:var(--gradient);flex:none}
.mrk .prik img{width:100%;height:100%;object-fit:contain;display:block}
.mrk b{font-size:15px;font-weight:800;letter-spacing:-.02em;display:block}
.mrk span{display:block;font-size:11px;color:var(--svag);font-weight:600}
nav{display:flex;flex-direction:column;gap:2px}
nav button{display:flex;align-items:center;gap:11px;padding:9px 12px;border-radius:10px;
  font-size:14px;font-weight:600;color:var(--daemp);text-align:left;transition:.14s;width:100%}
nav button:hover{background:var(--bg);color:var(--blaek)}
nav button.valgt{background:rgba(108,71,255,.09);color:var(--lilla)}
nav svg{width:17px;height:17px;flex:none}
.nav-mrk{padding:14px 12px 6px;font-size:10.5px;font-weight:800;color:var(--svag);
  text-transform:uppercase;letter-spacing:.07em}

/* live i menuen */
.live{margin:14px 10px 0;padding:11px 12px;border-radius:11px;background:var(--bg);
  border:1px solid var(--kant-blod)}
.live-top{display:flex;align-items:center;gap:7px;font-size:11px;font-weight:800;
  color:var(--svag);text-transform:uppercase;letter-spacing:.05em}
.puls{width:7px;height:7px;border-radius:50%;background:var(--groen);flex:none;
  box-shadow:0 0 0 0 rgba(16,185,129,.6);animation:puls 2s infinite}
@keyframes puls{70%{box-shadow:0 0 0 8px rgba(16,185,129,0)}100%{box-shadow:0 0 0 0 rgba(16,185,129,0)}}
.live-tal{font-size:24px;font-weight:800;letter-spacing:-.03em;margin-top:3px}
.live-under{font-size:11.5px;color:var(--svag);font-weight:600}
.bund{margin-top:auto;padding:0 10px}
.bund button{width:100%;padding:9px;border-radius:10px;border:1px solid var(--kant);
  font-size:13px;font-weight:600;color:var(--daemp)}

main{padding:24px 30px 64px;max-width:1320px;min-width:0}
.top{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;
  flex-wrap:wrap;margin-bottom:20px}
.top h1{font-size:25px;font-weight:800;letter-spacing:-.028em}
.top p{color:var(--daemp);font-size:13.5px;margin-top:2px}
.vaerktoej{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.vaelg{display:flex;gap:3px;background:#fff;border:1px solid var(--kant);border-radius:11px;padding:3px}
.vaelg button{padding:7px 12px;border-radius:8px;font-size:13px;font-weight:700;color:var(--daemp)}
.vaelg button.valgt{background:var(--lilla);color:#fff}

/* ── kort ── */
.net{display:grid;gap:14px;margin-bottom:14px}
.n4{grid-template-columns:repeat(4,1fr)}
.n3{grid-template-columns:repeat(3,1fr)}
.n2{grid-template-columns:repeat(2,1fr)}
.n21{grid-template-columns:2fr 1fr}
.kort{background:var(--kort);border:1px solid var(--kant);border-radius:var(--r);
  padding:17px;box-shadow:var(--skygge);min-width:0}
.kort h3{font-size:11.5px;font-weight:800;color:var(--svag);text-transform:uppercase;
  letter-spacing:.055em;margin-bottom:12px;display:flex;align-items:center;
  justify-content:space-between;gap:8px}
.kort h3 .ret{font-weight:600;text-transform:none;letter-spacing:0;font-size:11.5px}
/* lille spoergsmaalstegn i hjoernet af en boks, aabner en forklaring paa almindeligt dansk */
.hj{display:inline-flex;align-items:center;justify-content:center;width:20px;height:20px;border-radius:50%;
  border:1.5px solid var(--kant);background:#fff;color:var(--daemp);font-size:12px;font-weight:800;cursor:pointer;
  margin-left:8px;vertical-align:middle;text-transform:none;letter-spacing:0;transition:.14s}
.hj:hover,.hj.aaben{background:var(--lilla);border-color:var(--lilla);color:#fff}
.hj-boks{display:none;margin:10px 0 14px;padding:14px 16px;border-radius:12px;background:rgba(108,71,255,.06);
  border:1px solid rgba(108,71,255,.18);font-size:13.5px;line-height:1.75;color:var(--blaek);text-transform:none;letter-spacing:0;font-weight:500}
.hj-boks.vis{display:block}
.hj-boks b{font-weight:800}
.hj-boks ul{margin:6px 0 0 18px}
.raad{list-style:none;margin:0;padding:0}
.raad li{display:flex;align-items:flex-start;gap:10px;padding:10px 8px;border-radius:10px;font-size:13.5px;line-height:1.55;cursor:pointer;transition:.14s}
.raad li:hover{background:var(--bg)}
.raad li + li{border-top:1px solid var(--kant-blod)}
.raad-prik{flex:none;width:9px;height:9px;border-radius:50%;margin-top:7px;background:var(--svag)}
.raad-advar .raad-prik{background:#F59E0B}.raad-godt .raad-prik{background:var(--groen)}.raad-info .raad-prik{background:var(--lilla)}
.raad-pil{margin-left:auto;color:var(--svag);font-size:18px;line-height:1}
.kort-fortalt{font-size:14px;font-weight:600;color:var(--blaek);margin:0 0 12px;padding:10px 14px;border-left:3px solid var(--lilla);background:rgba(108,71,255,.05);border-radius:0 10px 10px 0}
.tal{font-size:27px;font-weight:800;letter-spacing:-.03em;line-height:1.15}
.aendring{display:inline-flex;align-items:center;gap:3px;font-size:12px;font-weight:700}
.op{color:var(--groen)} .ned{color:var(--roed)} .flad{color:var(--svag)}
.grund{font-size:11.5px;font-weight:600;color:var(--svag);margin-top:4px;line-height:1.45;max-width:260px}
/* lille graa linje under en overskrift: hvor tallene kommer fra, og hvilke dage de daekker */
.kilde{font-size:11.5px;font-weight:600;color:var(--svag);margin:-6px 0 10px;line-height:1.45;text-transform:none;letter-spacing:0}
.kort .kpi-bund + .kilde{margin:8px 0 0}
.advar-tekst{color:#92610B}
.sektion{font-size:11.5px;font-weight:800;color:var(--svag);text-transform:uppercase;letter-spacing:.055em;margin:4px 0 8px}
.sektion span{font-weight:600;text-transform:none;letter-spacing:0}
.kpi-bund{display:flex;align-items:flex-end;justify-content:space-between;gap:8px;margin-top:6px}

table{width:100%;border-collapse:collapse;font-size:13.5px}
th{text-align:left;font-size:10.5px;font-weight:800;color:var(--svag);text-transform:uppercase;
  letter-spacing:.055em;padding:0 8px 9px 0;border-bottom:1px solid var(--kant);white-space:nowrap}
th:last-child,td:last-child{padding-right:0}
th.s{cursor:pointer;user-select:none}
th.s:hover{color:var(--lilla)}
td{padding:9px 8px 9px 0;border-bottom:1px solid var(--kant-blod);vertical-align:middle}
tr:last-child td{border-bottom:none}
td.h{text-align:right;font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
td.d{color:var(--daemp);font-weight:500}
.navn{max-width:300px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bjaelke{height:4px;border-radius:3px;background:var(--gradient);min-width:3px;margin-top:5px}
.rul{overflow-x:auto;margin:0 -17px;padding:0 17px}

.tom{padding:36px 20px;text-align:center;color:var(--svag);font-size:14px;line-height:1.7}
.besked{padding:13px 15px;border-radius:12px;font-size:13.5px;font-weight:600;
  margin-bottom:16px;line-height:1.6}
.advar{background:#FFF7E8;color:#92610B;border:1px solid #FDE4B0}
.godt{background:#ECFDF5;color:#065F46;border:1px solid #A7F3D0}
.slem{background:#FEF2F2;color:#991B1B;border:1px solid #FECACA}
.info{background:#EEF4FF;color:#1E40AF;border:1px solid #C7D7FE}

.knap{padding:8px 15px;border-radius:10px;background:var(--lilla);color:#fff;
  font-size:13px;font-weight:700;white-space:nowrap}
.knap:hover{background:#5B38E8}
.knap.grim{background:#fff;color:var(--daemp);border:1px solid var(--kant)}
.knap.grim:hover{background:var(--bg);color:var(--blaek)}
.knap.fare{background:#fff;color:var(--roed);border:1px solid #FECACA}
.knap:disabled{opacity:.5;cursor:default}
.knap.lille{padding:5px 10px;font-size:12px;border-radius:8px}

.felt{margin-bottom:15px}
.felt label{display:block;font-size:12.5px;font-weight:700;color:var(--daemp);margin-bottom:5px}
.felt label span{font-weight:500;color:var(--svag)}
.felt input,.felt textarea,.felt select{width:100%;padding:10px 12px;border:1.5px solid var(--kant);
  border-radius:10px;font-size:14px;outline:none;transition:border-color .15s;background:#fff}
.felt input:focus,.felt textarea:focus,.felt select:focus{border-color:var(--lilla)}
.felt textarea{min-height:110px;resize:vertical;line-height:1.7;font-family:var(--font)}
.felt textarea.stor{min-height:340px}

.maerke{display:inline-block;padding:3px 9px;border-radius:999px;font-size:11px;font-weight:700;white-space:nowrap}
.m-udgivet{background:#ECFDF5;color:#065F46}
.m-kladde{background:#FEF3C7;color:#92610B}
.m-klar{background:#ECFDF5;color:#065F46}
.m-mangler{background:#FEF3C7;color:#92610B}
.m-pause{background:#EEF0F6;color:#5B5F7A}

/* tooltip. Ét element, som følger musen, i stedet for browserens langsomme title */
#tip{position:fixed;z-index:300;pointer-events:none;background:#14132A;color:#fff;
  padding:8px 11px;border-radius:9px;font-size:12.5px;line-height:1.45;font-weight:600;
  box-shadow:0 8px 28px rgba(20,19,42,.28);opacity:0;transform:translate(-50%,calc(-100% - 10px));
  transition:opacity .1s;white-space:nowrap;max-width:280px}
#tip.vis{opacity:1}
#tip b{font-weight:800;font-size:13.5px;display:block}
#tip small{display:block;color:rgba(255,255,255,.62);font-weight:500;font-size:11.5px}
#tip .p{display:flex;justify-content:space-between;gap:14px}
#tip .p i{font-style:normal;color:rgba(255,255,255,.7)}

/* søjler */
.soejler{display:flex;align-items:flex-end;gap:3px;height:150px;padding-top:26px;position:relative}
.soejle{flex:1;display:flex;flex-direction:column;align-items:center;min-width:0;height:100%;
  justify-content:flex-end;cursor:default}
.soejle .st{width:100%;border-radius:4px 4px 2px 2px;transition:filter .12s,transform .12s;
  transform-origin:bottom}
.soejle:hover .st{filter:brightness(.85);transform:scaleY(1.02)}
.soejle .mk{font-size:10px;color:var(--svag);font-weight:700;margin-top:6px;white-space:nowrap;height:14px}
.akse{display:flex;justify-content:space-between;font-size:11px;color:var(--svag);font-weight:600;margin-top:2px}

/* kurve med hover */
.kurve-boks{position:relative}
.kurve-boks svg{display:block;width:100%;height:auto}
.kurve-boks .pkt{cursor:crosshair}

/* donut */
.donut{display:flex;align-items:center;gap:22px}
.donut svg{width:132px;height:132px;flex:none}
.donut-liste{flex:1;min-width:0}
.donut-liste div{display:flex;align-items:center;gap:9px;padding:6px 0;font-size:13.5px;
  border-bottom:1px solid var(--kant-blod)}
.donut-liste div:last-child{border-bottom:none}
.donut-liste .f{width:10px;height:10px;border-radius:3px;flex:none}
.donut-liste .n{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.donut-liste .t{font-weight:700;font-variant-numeric:tabular-nums}
.donut-liste .pc{color:var(--svag);font-size:12px;width:44px;text-align:right;font-variant-numeric:tabular-nums}

.hoejre{min-width:0}
.proeve-bjaelke{position:sticky;top:0;z-index:50;background:#F59E0B;color:#1a1200;
  padding:10px 16px;font-weight:800;font-size:13.5px;text-align:center;letter-spacing:.01em}
/* skelet mens der hentes */
.skelet{background:linear-gradient(90deg,#EFEDF8 25%,#F7F5FD 50%,#EFEDF8 75%);
  background-size:200% 100%;animation:skim 1.3s infinite;border-radius:8px}
@keyframes skim{0%{background-position:200% 0}100%{background-position:-200% 0}}

/* skriveruden lægger sig over */
.overlag{position:fixed;inset:0;background:rgba(20,19,42,.45);z-index:90;
  display:flex;align-items:flex-start;justify-content:center;padding:36px 20px;overflow-y:auto}
.ark{background:#fff;border-radius:18px;width:100%;max-width:820px;padding:26px;
  box-shadow:0 30px 90px rgba(20,19,42,.3)}
.ark-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px;gap:12px}
.ark-top h2{font-size:19px;font-weight:800;letter-spacing:-.02em}

@media(max-width:1140px){.n4{grid-template-columns:repeat(2,1fr)}.n3,.n2,.n21{grid-template-columns:1fr}}
@media(max-width:860px){
  #app.vis{grid-template-columns:1fr}
  aside{position:static;height:auto;flex-direction:row;align-items:center;overflow-x:auto;padding:11px}
  .mrk{padding:0 12px 0 4px}.mrk span{display:none}
  nav{flex-direction:row;gap:4px}nav button{white-space:nowrap;padding:8px 11px}
  .nav-mrk,.live{display:none}
  .bund{margin:0 0 0 auto;padding:0}
  main{padding:18px 15px 48px}
  .n4{grid-template-columns:repeat(2,1fr)}
}

/* ── nyt i anden omgang ── */
#login .navn{margin-top:24px;max-width:none}
#login .husk{display:flex;align-items:center;gap:9px;margin-top:14px;font-size:13.5px;color:var(--daemp);cursor:pointer;user-select:none}
#login .husk input{width:17px;height:17px;margin:0;padding:0;accent-color:var(--lilla);cursor:pointer}
#login .navn + input{margin-top:10px}
.hvem{margin:0 10px 8px;padding:9px 12px;border-radius:10px;font-size:12px;color:var(--daemp);
  background:var(--bg);border:1px solid var(--kant-blod)}
.hvem b{display:block;color:var(--blaek);font-size:13px}
.rolle{display:inline-block;padding:2px 8px;border-radius:999px;font-size:10.5px;font-weight:800;
  text-transform:uppercase;letter-spacing:.05em;margin-top:3px}
.r-ejer{background:rgba(108,71,255,.12);color:var(--lilla)}
.r-redigerer{background:#ECFDF5;color:#065F46}
.r-laeser{background:#FEF3C7;color:#92610B}

/* tragt */
.tragt{display:flex;flex-direction:column;gap:6px}
.trin{display:grid;grid-template-columns:200px 1fr 90px;align-items:center;gap:14px;padding:8px 0}
.trin .n{font-weight:700;font-size:14px}
.trin .n small{display:block;font-weight:500;color:var(--svag);font-size:11.5px}
.trin .b{height:38px;border-radius:9px;background:var(--gradient);display:flex;align-items:center;
  padding:0 12px;color:#fff;font-weight:800;font-size:14px;min-width:60px;transition:width .5s}
.trin .t{text-align:right;font-weight:700;color:var(--daemp);font-size:13px}
.fald{display:flex;align-items:center;gap:8px;padding:0 0 0 214px;font-size:12px;color:var(--roed);font-weight:700}
.fald span{color:var(--svag);font-weight:600}

/* oppetid */
.oppe-prik{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:7px;vertical-align:middle}
.oppe-linje{display:flex;gap:2px;height:34px;align-items:flex-end}
.oppe-linje i{flex:1;border-radius:2px;background:var(--groen);min-width:2px;height:100%}
.oppe-linje i.ned{background:var(--roed)}
.oppe-linje i.tom{background:var(--kant-blod)}

/* noter paa kurven */
.note-mk{cursor:pointer}
.noteliste div{display:flex;align-items:center;gap:10px;padding:7px 0;border-bottom:1px solid var(--kant-blod);font-size:13.5px}
.noteliste div:last-child{border-bottom:none}
.noteliste time{color:var(--svag);font-size:12px;font-weight:700;width:76px;flex:none}
.noteliste span{flex:1}
.noteliste button{color:var(--svag);font-size:12px;font-weight:700}
.noteliste button:hover{color:var(--roed)}
.raekke{display:flex;gap:10px;align-items:flex-end;flex-wrap:wrap}
.raekke .felt{flex:1;min-width:140px;margin:0}

/* linkbygger */
.link-ud{display:flex;gap:16px;align-items:flex-start;flex-wrap:wrap;margin-top:14px;padding:14px;
  background:var(--bg);border-radius:12px;border:1px solid var(--kant-blod)}
.link-ud .url{flex:1;min-width:240px;font-family:ui-monospace,monospace;font-size:12.5px;word-break:break-all;
  padding:10px 12px;background:#fff;border:1px solid var(--kant);border-radius:9px}
.qr{width:132px;height:132px;background:#fff;border-radius:9px;padding:6px;border:1px solid var(--kant);flex:none}
.qr canvas,.qr img{width:120px!important;height:120px!important;display:block}

/* seo */
.score{width:110px;height:110px;border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;flex:none;position:relative}
.score b{font-size:34px;font-weight:800;letter-spacing:-.03em;line-height:1}
.score small{font-size:10.5px;color:var(--svag);font-weight:700;text-transform:uppercase;letter-spacing:.05em;margin-top:2px}
.opg{display:flex;gap:12px;padding:11px 0;border-bottom:1px solid var(--kant-blod);align-items:flex-start}
.opg:last-child{border-bottom:none}
.grad{flex:none;width:8px;height:8px;border-radius:50%;margin-top:7px}
.g-fejl{background:var(--roed)} .g-advar{background:var(--gul)} .g-info{background:var(--svag)}
.opg .t{flex:1;min-width:0}
.opg .t b{display:block;font-size:13.5px}
.opg .t p{font-size:12.5px;color:var(--daemp);margin-top:2px;line-height:1.55}

<script>
/* ── dansk. Google svarer på engelsk, og det skal ikke ud til Nicko ── */
const KANAL = {'Organic Search':'Organisk søgning','Direct':'Direkte','Paid Social':'Betalt social',
  'Organic Social':'Organisk social','Referral':'Henvisning','Paid Search':'Betalt søgning',
  'Email':'E-mail','Unassigned':'Ukendt','Cross-network':'På tværs af netværk','Display':'Display',
  'Organic Video':'Organisk video','Affiliates':'Partnere','Paid Video':'Betalt video',
  'Paid Other':'Betalt, andet','Organic Shopping':'Organisk shopping','Paid Shopping':'Betalt shopping',
  'SMS':'SMS','Mobile Push Notifications':'Push-beskeder','Audio':'Lyd','Intern':'Inde fra siden'};
const ENHED = {mobile:'Mobil',desktop:'Computer',tablet:'Tablet',smarttv:'Smart-tv',
  MOBILE:'Mobil',DESKTOP:'Computer',TABLET:'Tablet'};
// Googles egne ord for "ved det ikke" bliver til Ukendt i alle lister
const RAA_UKENDT = /^\s*\((not set|data not available)\)\s*$/i;
const erUkendt = k => k == null || String(k).trim() === '' || RAA_UKENDT.test(String(k));
const ukendt = k => erUkendt(k) ? 'Ukendt' : k;
const HANDLING = {page_view:'Sidevisning',scroll:'Rullet ned',click:'Klik på link',
  session_start:'Besøg startet',first_visit:'Første besøg',user_engagement:'Engagement',
  form_start:'Formular påbegyndt',form_submit:'Formular sendt',file_download:'Fil hentet',
  video_start:'Video startet',video_progress:'Video set',video_complete:'Video set færdig',
  view_search_results:'Søgning på siden',outbound_click:'Klik ud af siden',
  klik_hent:'Klik på hent',chat_aabnet:'Chat åbnet',chat_besked:'Besked i chatten',
  klik_appstore:'Klik til App Store',klik_googleplay:'Klik til Google Play'};
const MEDIE = {organic:'organisk',cpc:'betalt',ppc:'betalt',paid:'betalt',referral:'henvisning',
  email:'e-mail',social:'social',print:'print',qr:'QR-kode','(none)':'','(not set)':''};
// Search Console giver lande som tre bogstaver, Analytics som to. Begge
// oversættes med browserens egen landeliste, så vi slipper for at skrive
// 250 lande af.
const A3 = {dnk:'DK',deu:'DE',swe:'SE',nor:'NO',fin:'FI',isl:'IS',fro:'FO',grl:'GL',usa:'US',
  gbr:'GB',nld:'NL',bel:'BE',fra:'FR',esp:'ES',ita:'IT',pol:'PL',aut:'AT',che:'CH',irl:'IE',
  prt:'PT',cze:'CZ',ltu:'LT',lva:'LV',est:'EE',can:'CA',aus:'AU',tur:'TR',ukr:'UA',rou:'RO',
  hun:'HU',grc:'GR',ind:'IN',bra:'BR',jpn:'JP',chn:'CN',kor:'KR',mex:'MX',zaf:'ZA',are:'AE',
  tha:'TH',phl:'PH',idn:'ID',vnm:'VN',pak:'PK',nga:'NG',egy:'EG',isr:'IL',sau:'SA',arg:'AR',
  chl:'CL',col:'CO',nzl:'NZ',sgp:'SG',mys:'MY',hkg:'HK',twn:'TW',rus:'RU',srb:'RS',hrv:'HR',
  svk:'SK',svn:'SI',bgr:'BG',lux:'LU',mlt:'MT',cyp:'CY'};
let landeNavne = null;
try { landeNavne = new Intl.DisplayNames(['da'], {type:'region'}); } catch (e) {}
function land(k) {
  if (erUkendt(k)) return 'Ukendt';
  let kode = String(k).trim();
  if (kode.length === 3) kode = A3[kode.toLowerCase()] || '';
  if (kode.length !== 2) return k;
  try { return landeNavne ? landeNavne.of(kode.toUpperCase()) : kode.toUpperCase(); }
  catch (e) { return kode.toUpperCase(); }
}
const kanal    = k => KANAL[k] || ukendt(k);
const enhed    = k => ENHED[k] || ukendt(k);
const handling = k => HANDLING[k] || k;
const ikkeSat  = ukendt;
// "google / organic" bliver til "Google, organisk"; "(direct) / (none)" til "Direkte"
function kilde(k) {
  if (erUkendt(k)) return 'Ukendt';
  const [a, b] = String(k).split(' / ').map(x => (x||'').trim());
  if (a === '(direct)') return 'Direkte';
  const navn = erUkendt(a) ? 'Ukendt' : a.charAt(0).toUpperCase() + a.slice(1);
  const m = erUkendt(b) ? '' : MEDIE[b] !== undefined ? MEDIE[b] : b;
  return m ? navn + ', ' + m : navn;
}
/* Rækker, der vises med samme navn (fx '' og '(not set)', som begge bliver Ukendt), lægges
   sammen til én. Tal lægges sammen. Andele, gennemsnit og placering (bounceRate, ctr, plads) vægtes efter feltet vaegt. */
function samlVist(raekker, felt, form, vaegt) {
  if (!Array.isArray(raekker)) return raekker;
  const ud = [], efter = new Map();
  raekker.forEach(r => {
    const navn = String(form ? form(r[felt]) : r[felt]);
    const f = efter.get(navn);
    if (!f) { const ny = { ...r }; efter.set(navn, ny); ud.push(ny); return; }
    const vf = Number(f[vaegt]) || 0, vr = Number(r[vaegt]) || 0;
    Object.keys(r).forEach(k => {
      if (k === felt || typeof r[k] !== 'number') return;
      if (vaegt && /rate$|^average|^ctr$|^plads$|position/i.test(k)) f[k] = (vf + vr) ? ((Number(f[k])||0)*vf + r[k]*vr) / (vf + vr) : f[k];
      else f[k] = (typeof f[k] === 'number' ? f[k] : 0) + r[k];
    });
  });
  return ud;
}
const medie = k => MEDIE[k] !== undefined ? (MEDIE[k] || '(intet)') : k;

/* ── tal og tekst ── */
const T = n => (Number(n)||0).toLocaleString('da-DK');
const P = (n,d=1) => (Number(n)||0).toLocaleString('da-DK',{maximumFractionDigits:d});
const pct = (n,d=1) => P((Number(n)||0)*100, d) + ' %';
const tid = s => { s = Math.round(Number(s)||0);
  return s < 60 ? s + ' sek' : Math.floor(s/60) + ' min ' + String(s%60).padStart(2,'0') + ' sek'; };
const sik = s => String(s==null?'':s).replace(/[&<>"']/g, c =>
  ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const dagnavn = n => ['Søndag','Mandag','Tirsdag','Onsdag','Torsdag','Fredag','Lørdag'][Number(n)] || n;
const datoKort = s => !s ? '' : s.length === 10 ? s.slice(8,10) + ':00'
  : s.length === 8 ? Number(s.slice(6,8)) + '/' + Number(s.slice(4,6)) : s;

// tal der kan mangle: null eller undefined vises som –, aldrig som 0. TT(n, form) bruger form (pct, tid, kr ...) når tallet findes.
const mangler = n => n == null || (typeof n === 'number' && isNaN(n));
const TT = (n, form) => mangler(n) ? '–' : (form || T)(n);

/* ── kilde og dækning ved hver boks ──
   Backenden sender kilde ('egen', 'ga4', 'gsc' ...) og daekning { fra, til, dage, af, hel, grund }.
   kildeLinje giver den lille grå linje under en overskrift, fx "Egen tæller, alle besøgende, 17. sep. til 5. okt." */
const KILDEKORT = { egen:'Egen tæller, alle besøgende', ga4:'Google Analytics, kun cookie-ja', gsc:'Search Console', play:'Google Play',
  appstore:'App Store', meta:'Meta', googleads:'Google Ads', bot:'Chatbotten', oppetid:'Oppetidsvagten', psi:'Google PageSpeed',
  seo:'Egen gennemgang af siden', db:'Databasen' };
function kildeTekst(k, daek, ekstra) {
  const navn = Array.isArray(k) ? k.map(x => KILDEKORT[x] || x).join(' og ') : (KILDEKORT[k] || k || '');
  let t = navn;
  if (daek && daek.hel === false) t += daek.fra ? (t ? ', ' : '') + 'kun ' + (daek.fra === daek.til ? datoDk(daek.fra) : datoDk(daek.fra) + ' til ' + datoDk(daek.til))
    : (t ? ', ' : '') + 'ingen tal i perioden';
  if (ekstra) t += (t ? (/\.$/.test(t) ? ' ' : '. ') : '') + ekstra;   // ingen dobbelt punktum efter 'okt.'
  return t;
}
// sætter punktum, uden at give to efter en forkortelse som 'sep.'
const punkt = s => !s ? '' : /\.$/.test(s) ? s : s + '.';
const kildeLinje = (k, daek, ekstra) => { const t = kildeTekst(k, daek, ekstra); return t ? '<div class="kilde">' + sik(t) + '</div>' : ''; };
/* Gul besked øverst, når tallene kun dækker en del af den valgte periode. ekstra er en sætning mere. */
const daekBesked = (daek, ekstra) => !daek || daek.hel !== false ? '' :
  '<div class="besked advar"><b>Kun en del af perioden har tal.</b> ' + sik(daek.grund || 'Kilden har ikke tal for alle dage.') + (ekstra ? ' ' + sik(ekstra) : '') + '</div>';
/* En lang grund vises kort: første sætning står under tallet, hele teksten kommer frem, når musen holdes over.
   Sætninger deles kun ved punktum + stort bogstav, så "16. sep." ikke deles. */
function kortGrund(g) {
  if (!g) return '';
  const dele = String(g).replace(/\.\s+(?=[A-ZÆØÅ])/g, '.\n').split('\n');
  if (dele.length < 2) return '<div class="grund">' + sik(g) + '</div>';
  return '<div class="grund" data-tip="' + sik(sik(g)) + '" style="cursor:help">' + sik(dele[0]) + ' <span style="text-decoration:underline dotted">mere</span></div>';
}
// tidspunkt i dansk tid, fx "5. okt. 09.12"
const tidDk = s => { const d = new Date(s); return isNaN(d) ? '' : d.toLocaleString('da-DK',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit',timeZone:'Europe/Copenhagen'}); };

/* Pil med ændring i procent. Ingen pil, når et af tallene mangler (null), og aldrig procent mod 0:
   er perioden før 0, står der "ny" (eller intet, hvis begge er 0).
   grund: kort tekst, der vises i stedet for pilen, når der ikke kan sammenlignes. '' = vis intet. */
function pil(nu, foer, vendt, form, grund) {
  const f = form || T;
  const ingen = g => g === '' ? '' : '<span class="aendring flad">' + sik(g == null ? 'ingen sammenligning' : g) + '</span>';
  if (mangler(nu)) return grund ? ingen(grund) : '';
  if (mangler(foer)) return ingen(grund);
  nu = Number(nu); foer = Number(foer);
  if (foer === 0) return nu > 0 ? '<span class="aendring flad" data-tip="' + sik('<b>' + f(nu) + '</b>mod 0 i perioden før') + '" style="cursor:default">ny</span>' : '';
  const p = ((nu - foer) / foer) * 100;
  const t = sik('<b>' + f(nu) + '</b>mod ' + f(foer) + ' i perioden før');
  if (Math.abs(p) < 0.5) return '<span class="aendring flad" data-tip="' + t + '">uændret</span>';
  const godt = vendt ? p < 0 : p > 0;
  return '<span class="aendring ' + (godt?'op':'ned') + '" data-tip="' + t + '" style="cursor:default">' +
    (p > 0 ? '▲' : '▼') + ' ' + P(Math.abs(p)) + ' %</span>';
}

/* ── tooltip ── */
const tipEl = () => document.getElementById('tip');
document.addEventListener('mouseover', e => {
  const t = e.target.closest('[data-tip]');
  if (!t) return;
  const el = tipEl(); el.innerHTML = t.dataset.tip; el.classList.add('vis');
});
document.addEventListener('mousemove', e => {
  const el = tipEl(); if (!el.classList.contains('vis')) return;
  const b = el.getBoundingClientRect();
  let x = e.clientX, y = e.clientY;
  // hold den inden for skærmen
  x = Math.max(b.width/2 + 8, Math.min(window.innerWidth - b.width/2 - 8, x));
  if (y - b.height - 14 < 0) { el.style.transform = 'translate(-50%, 16px)'; }
  else el.style.transform = 'translate(-50%, calc(-100% - 10px))';
  el.style.left = x + 'px'; el.style.top = y + 'px';
});
document.addEventListener('mouseout', e => {
  const t = e.target.closest('[data-tip]');
  if (t && !t.contains(e.relatedTarget)) tipEl().classList.remove('vis');
});
const tip = (...linjer) => sik(linjer.filter(Boolean).join('\n'))
  .replace(/\n/g,'<br>').replace(/&lt;b&gt;/g,'<b>').replace(/&lt;\/b&gt;/g,'</b>')
  .replace(/&lt;small&gt;/g,'<small>').replace(/&lt;\/small&gt;/g,'</small>')
  .replace(/&quot;/g,'&quot;');

/* ── skelet mens der hentes ── */
const skeletKort = n => '<div class="net n4">' + Array(n).fill(
  '<div class="kort"><div class="skelet" style="height:11px;width:60%"></div>' +
  '<div class="skelet" style="height:28px;width:78%;margin-top:13px"></div>' +
  '<div class="skelet" style="height:11px;width:42%;margin-top:9px"></div></div>').join('') + '</div>' +
  '<div class="kort"><div class="skelet" style="height:210px"></div></div>';

/* ── sparkline til nøgletalskortene ── */
function spark(vaerdier, farve) {
  // null er ukendt og springes over, så den ikke tegnes som 0
  const v = (vaerdier||[]).map(n => mangler(n) ? NaN : Number(n)).filter(n => !isNaN(n));
  if (v.length < 2) return '';
  const maks = Math.max(...v, 1), min = Math.min(...v), B = 96, H = 28;
  const x = i => (i/(v.length-1))*B;
  const y = n => H - 2 - ((n-min)/((maks-min)||1))*(H-5);
  return '<svg viewBox="0 0 ' + B + ' ' + H + '" style="width:96px;height:28px;flex:none;overflow:visible">' +
    '<path d="' + v.map((n,i)=>(i?'L':'M')+x(i).toFixed(1)+' '+y(n).toFixed(1)).join(' ') +
    '" fill="none" stroke="' + (farve||'#6C47FF') + '" stroke-width="2" ' +
    'stroke-linecap="round" stroke-linejoin="round" opacity=".8"/></svg>';
}

/* ── søjler, til timer og ugedage ── */
function soejler(raekker, noegle, vaerdi, navnFn, maerkeHver, enhedTekst) {
  if (raekker === null) return '<div class="tom">Kunne ikke hentes</div>';
  if (!raekker || !raekker.length) return '<div class="tom">Ingen data</div>';
  const v = raekker.map(r => Number(r[vaerdi])||0);
  const maks = Math.max(...v, 1), sum = v.reduce((a,b)=>a+b,0) || 1;
  const bedste = v.indexOf(maks);
  return '<div class="soejler">' + raekker.map((r,i) => {
    const n = v[i], navn = navnFn ? navnFn(r[noegle]) : r[noegle];
    const f = n/maks;
    // en søjle uden tal (null) er ukendt, ikke 0: den tegnes som en lys stump, og tippet siger –
    const farve = mangler(r[vaerdi]) ? '#EFEDF8' : f > .66 ? 'var(--lilla)' : f > .33 ? '#9B84FF' : '#D3CBF9';
    const vis = maerkeHver ? (i % maerkeHver === 0) : true;
    return '<div class="soejle" data-tip="' + sik('<b>' + TT(r[vaerdi]) + ' ' + (enhedTekst||'besøg') + '</b>' +
        navn + (mangler(r[vaerdi]) ? '' : '<small>' + P(n/sum*100) + ' % af perioden' +
        (r.dage ? ', ' + r.dage + ' af den ugedag i perioden' : '') + '</small>')) + '">' +
      (i === bedste ? '<div style="font-size:10.5px;font-weight:800;color:var(--lilla);margin-bottom:4px">' + T(n) + '</div>' : '') +
      '<div class="st" style="height:' + Math.max(2, f*100) + '%;background:' + farve + '"></div>' +
      '<div class="mk">' + (vis ? sik(navn) : '') + '</div></div>';
  }).join('') + '</div>';
}

/* ── donut, til enheder ── enhed (fx 'tryk') står efter tallet i tip og liste, så alle stykker læses i samme enhed */
function donut(raekker, noegle, vaerdi, navnFn, enhed) {
  const med = n => enhed ? n + ' ' + enhed : n;
  if (raekker === null) return '<div class="tom">Kunne ikke hentes</div>';
  if (!raekker || !raekker.length) return '<div class="tom">Ingen data</div>';
  const farver = ['#6C47FF','#3B82F6','#EC4899','#10B981','#F59E0B'];
  const sum = raekker.reduce((a,r)=>a+(Number(r[vaerdi])||0),0) || 1;
  let vinkel = -90;
  const R = 52, C = 66, tyk = 16;
  const bue = raekker.map((r,i) => {
    const n = Number(r[vaerdi])||0, grad = n/sum*360;
    const a0 = vinkel*Math.PI/180, a1 = (vinkel+grad-0.6)*Math.PI/180;
    vinkel += grad;
    const x0=C+R*Math.cos(a0), y0=C+R*Math.sin(a0), x1=C+R*Math.cos(a1), y1=C+R*Math.sin(a1);
    const navn = navnFn ? navnFn(r[noegle]) : r[noegle];
    return '<path d="M' + x0 + ' ' + y0 + ' A' + R + ' ' + R + ' 0 ' + (grad>180?1:0) + ' 1 ' + x1 + ' ' + y1 +
      '" fill="none" stroke="' + farver[i%farver.length] + '" stroke-width="' + tyk + '" ' +
      'data-tip="' + sik('<b>' + med(T(n)) + '</b>' + navn + '<small>' + P(n/sum*100) + ' %</small>') + '" ' +
      'style="cursor:default;transition:opacity .12s" onmouseover="this.style.opacity=.75" onmouseout="this.style.opacity=1"/>';
  }).join('');
  const stoerst = raekker[0];
  return '<div class="donut"><svg viewBox="0 0 132 132">' + bue +
    '<text x="66" y="62" text-anchor="middle" font-size="19" font-weight="800" fill="#14132A" ' +
      'font-family="Plus Jakarta Sans,sans-serif">' + P((Number(stoerst[vaerdi])||0)/sum*100, 0) + ' %</text>' +
    '<text x="66" y="78" text-anchor="middle" font-size="10.5" font-weight="700" fill="#9B97B5" ' +
      'font-family="Plus Jakarta Sans,sans-serif">' + sik(navnFn ? navnFn(stoerst[noegle]) : stoerst[noegle]) + '</text>' +
    '</svg><div class="donut-liste">' + raekker.map((r,i) => {
      const n = Number(r[vaerdi])||0;
      return '<div><span class="f" style="background:' + farver[i%farver.length] + '"></span>' +
        '<span class="n">' + sik(navnFn ? navnFn(r[noegle]) : r[noegle]) + '</span>' +
        '<span class="t">' + (mangler(r[vaerdi]) ? '–' : med(TT(r[vaerdi]))) + '</span><span class="pc">' + (mangler(r[vaerdi]) ? '' : P(n/sum*100) + ' %') + '</span></div>';
    }).join('') + '</div></div>';
}

/* ── tabeller, sorterbare og med udtræk ──
   tabel(id, raekker, kol, tom, std)
   kol: [{ navn, felt, h (tal, højrestillet), form(v, raekke), bar, daemp, std, sortVaerdi(raekke), nul }]
   - std:true sorterer kolonnen faldende fra start, std:'op' stigende. Uden std: anden kolonne, faldende.
   - std (5. argument) = { felt, ned } sorterer efter et felt, der ikke vises (fx visninger).
   - sortVaerdi(raekke) bruges, når kolonnen viser noget andet end feltet (fx en rate).
   - Tomme talfelter (null/undefined) i h-kolonner vises som – uden at kalde form. nul:true = form klarer null selv.
   - raekker === null betyder, at rapporten fejlede, og giver "Kunne ikke hentes".
   Klik på en kolonne sorterer, og valget huskes i sidsteTabel, indtil periode eller side skifter. */
function tabel(id, raekker, kol, tom, std) {
  if (raekker === null) return '<div class="tom">Kunne ikke hentes</div>';
  if (!raekker || !raekker.length) return '<div class="tom">' + tom + '</div>';
  const gl = sidsteTabel[id] && sidsteTabel[id].sort;
  const si = kol.findIndex(k => k.std), sk = si >= 0 ? si : (kol.length > 1 ? 1 : 0);
  const s = gl || (std && si < 0 ? { i: -1, felt: std.felt, ned: std.ned !== false } : { i: sk, ned: !(kol[sk] && kol[sk].std === 'op') });
  sidsteTabel[id] = { raekker, kol, tom, std, sort: s };
  const sk2 = kol[s.i];
  const vaerdi = v => s.i < 0 ? v[s.felt] : sk2 && sk2.sortVaerdi ? sk2.sortVaerdi(v) : sk2 ? v[sk2.felt] : undefined;
  const tomt = x => x == null || x === '' || (typeof x === 'number' && isNaN(x));
  const r = [...raekker].sort((a,b) => {
    const x = vaerdi(a), y = vaerdi(b);
    if (tomt(x) || tomt(y)) return tomt(x) === tomt(y) ? 0 : tomt(x) ? 1 : -1;   // tomme står altid nederst
    const t = (typeof x === 'number' && typeof y === 'number') ? x - y : String(x).localeCompare(String(y), 'da', { numeric: true });
    return s.ned ? -t : t;
  });
  // "% af alle" regnes af periodens rigtige total (k.total fra backenden), ikke af de rækker, der står i listen.
  // Uden total står der "% af rækkerne her", så det ikke ligner en andel af alt.
  const maks = {}, sum = {}, tot = {};
  kol.forEach(k => { if (k.bar) {
    maks[k.bar] = Math.max(...r.map(v => Number(v[k.bar])||0), 1);
    sum[k.bar]  = r.reduce((a,v) => a + (Number(v[k.bar])||0), 0) || 1;
    tot[k.bar]  = !mangler(k.total) && Number(k.total) > 0 ? Number(k.total) : null; } });
  const andel = (b, n) => tot[b] ? P(n/tot[b]*100) + ' % af alle' : P(n/sum[b]*100) + ' % af rækkerne her';
  return '<div class="rul" data-tabel="' + sik(id) + '"><table><thead><tr>' +
    kol.map((k, i) => '<th class="s' + (k.h ? ' ' : '') + '" style="' + (k.h?'text-align:right':'') +
      '" onclick="sorter(\'' + id + '\',' + i + ')">' + k.navn +
      (s.i === i ? (s.ned ? ' ↓' : ' ↑') : '') + '</th>').join('') +
    '</tr></thead><tbody>' +
    r.map(v => '<tr>' + kol.map(k => {
      const raa = v[k.felt];
      const vist = (k.h && !k.nul && mangler(raa)) ? '–'
        : k.form ? k.form(raa, v) : (typeof raa === 'number' ? T(raa) : sik(ukendt(raa)));
      if (k.h) return '<td class="h">' + vist + '</td>';
      return '<td' + (k.daemp ? ' class="d"' : '') + '><div class="navn">' + vist + '</div>' +
        (k.bar && !mangler(v[k.bar]) ? '<div class="bjaelke" data-tip="' + sik('<b>' + T(v[k.bar]) + '</b>' +
          andel(k.bar, Number(v[k.bar])||0)) + '" style="width:' +
          Math.max(3,((Number(v[k.bar])||0)/maks[k.bar])*100) + '%;cursor:default"></div>' : '') + '</td>';
    }).join('') + '</tr>').join('') + '</tbody></table></div>';
}
// tegner kun tabellen igen (ingen ny hentning). Første klik: tal faldende, tekst stigende.
function sorter(id, i) {
  const t = sidsteTabel[id]; if (!t) return;
  const k = t.kol[i] || {};
  t.sort = { i, ned: t.sort && t.sort.i === i ? !t.sort.ned : !!(k.h || k.std === true) };
  const el = document.querySelector('[data-tabel="' + id + '"]');
  if (el) el.outerHTML = tabel(id, t.raekker, t.kol, t.tom, t.std); else vis();
}
function udtraek(id, filnavn) {
  const t = sidsteTabel[id];
  if (!t) return flash('Der er ikke noget at trække ud', 'advar');
  const linjer = [t.kol.map(k => k.navn).join(';')].concat(
    t.raekker.map(r => t.kol.map(k => {

      return typeof v === 'number' ? String(v).replace('.', ',') : '"' + String(v==null?'':v).replace(/"/g,'""') + '"';
    }).join(';')));
  const b = new Blob(['﻿' + linjer.join('\r\n')], {type:'text/csv;charset=utf-8'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(b); a.download = filnavn + '.csv';
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 2000);
}

const GENTAG_IKKE = /gem|slet|udgiv|bekraeft|fjern|koer|udkast|test|start|opfrisk|login/;
async function kald(d, krop, forsoeg) {
  forsoeg = forsoeg || 0;
  let r, s;
  try {
    r = await fetch('/api?d=' + d, { method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify(Object.assign({ seddel }, krop || {})) });
    s = await r.json().catch(()=>null);
  } catch (e) { r = null; s = null; }
  const midlertidig = !r || s === null || r.status === 502 || r.status === 503 || r.status === 504;
  if (midlertidig && forsoeg < 2 && !GENTAG_IKKE.test(d)) {
    await new Promise(x => setTimeout(x, 1500 * (forsoeg + 1)));
    return kald(d, krop, forsoeg + 1);
  }
  if (!r) throw new Error('Kunne ikke få fat i serveren');
  if (s === null) s = { fejl: 'Serveren var langsom. Prøv igen om lidt.' };
  if (r.status === 401) { logUd(); throw new Error('Log ind igen'); }
  if (!r.ok) throw new Error(s.fejl || 'Noget gik galt');
  return s;
}

/* fejl fra backenden som en liste af korte danske tekster. Tager alle tre former:

/* Om en boks' data faktisk mangler: en liste, der er null (rapporten fejlede), eller et nøgletal { nu } uden tal.

const boksMangler = x => x === null || (!!x && typeof x === 'object' && !Array.isArray(x) && 'nu' in x && mangler(x.nu) &&

/* Hvilke bokse en kildefejl rammer. Kun bokse, der bruger kilden OG hvis tal faktisk mangler, så en fejl i én rapport

function ramteBokse(d, kilde, navne, felter) {

/* Når en kilde fejler, vises resten af siden, og her står hvilken kilde det var. Bokse nævnes kun, når deres tal

/* ── stor kurve med sammenligning, hover og noter ── */
/* Timekurver ('YYYYMMDDHH'): sorteres efter time, og huller fyldes med 0 fra kl. 00 til den sidste time,
   der findes. Der lægges aldrig timer til efter den sidste, så en dag, der ikke er slut, ikke får falske 0.
   Dagkurver sorteres kun; manglende dage fylder backenden selv ud (tom dag kan betyde "ingen tal"). */
function sorterKurve(raekker) {
  if (!Array.isArray(raekker) || raekker.length < 2) return raekker;
  const r = [...raekker].sort((a,b) => String(a.date).localeCompare(String(b.date)));
  if (!r.every(x => String(x.date||'').length === 10)) return r;
  const dag = String(r[0].date).slice(0,8);
  if (!r.every(x => String(x.date).slice(0,8) === dag)) return r;
  const m = new Map(r.map(x => [Number(String(x.date).slice(8,10)), x]));
  const sidste = Math.max(...m.keys());
  return Array.from({length: sidste + 1}, (_, h) => m.get(h) ||
    { date: dag + String(h).padStart(2,'0'), activeUsers: 0, sessions: 0, screenPageViews: 0 });
}
/* nu og foer er lige lange og parret efter plads (dag 1 med dag 1, kl. 00 med kl. 00); backenden sender dem sådan.
   En værdi, der mangler (null), er ukendt og ikke 0: kurven får et hul, og tippet viser –.
   enhed er ordet i tippet (standard "besøgende"). */
function storKurve(nu, foer, noter, enhed) {
  if (nu === null) return '<div class="tom">Kurven kunne ikke hentes</div>';
  nu = sorterKurve(nu); foer = sorterKurve(foer);
  const ord = enhed || 'besøgende';
  const vaerdi = r => !r || mangler(r.activeUsers) ? null : Number(r.activeUsers) || 0;
  const a = (nu || []).map(vaerdi), b = (foer||[]).map(vaerdi);
  if (!nu || nu.length < 2 || a.filter(n => n != null).length < 2) return '<div class="tom">Der er endnu ikke nok dage med tal til at tegne en kurve</div>';
  const maks = Math.max(...a.filter(n => n != null), ...b.filter(n => n != null), 1);
  const B = 1000, H = 240, pv = 16, ph = 44, bund = 26;
  const x = (i,n) => ph + (n<2 ? 0 : (i/(n-1))*(B-ph-pv));
  const y = n => H - bund - (n/maks)*(H-bund-pv);

  const sti = vv => { let ud = '', ny = true;
    vv.forEach((n,i) => { if (n == null) { ny = true; return; } ud += (ny ? 'M' : 'L') + x(i,vv.length).toFixed(1) + ' ' + y(n).toFixed(1) + ' '; ny = false; });

  const prikker = huller ? a.map((n,i) => n == null ? '' : '<circle cx="' + x(i,a.length) + '" cy="' + y(n) + '" r="3" fill="#6C47FF"/>').join('') : '';
  const trin = [1,2,5,10,20,25,50,100,200,250,500,1000,2000,5000,10000].find(t => maks/t <= 5) || 10000;
  let net = '';
  for (let v = 0; v <= maks; v += trin) net += '<line x1="' + ph + '" y1="' + y(v) + '" x2="' + (B-pv) + '" y2="' + y(v) +
    '" stroke="#EFEDF8"/><text x="' + (ph-9) + '" y="' + (y(v)+4) + '" font-size="11" fill="#9B97B5" text-anchor="end" font-family="Plus Jakarta Sans,sans-serif">' + T(v) + '</text>';
  const hver = Math.max(1, Math.ceil(nu.length/8));
  const datoer = nu.map((r,i) => (i % hver && i !== nu.length-1) ? '' :
    '<text x="' + x(i,nu.length) + '" y="' + (H-7) + '" font-size="11" fill="#9B97B5" text-anchor="middle" font-family="Plus Jakarta Sans,sans-serif">' + datoKort(r.date) + '</text>').join('');
  const bredde = (B-ph-pv)/(a.length-1);
  const felter = a.map((n,i) => {
    const d = nu[i].date;
    const dd = !d ? '' : d.length===10 ? 'kl. ' + d.slice(8,10) + ':00, ' + Number(d.slice(6,8)) + '/' + Number(d.slice(4,6))
             : d.length===8 ? d.slice(6,8)+'.'+d.slice(4,6)+'.'+d.slice(0,4) : d;
    const f = b[i], fR = (foer||[])[i];
    const t = '<b>' + TT(n) + ' ' + ord + '</b>' + dd + (fR ? '<small>Perioden før: ' + TT(f) + (n != null && f != null && f > 0 ? ' (' + (n>=f?'+':'') + P((n-f)/f*100,0) + ' %)' : '') + '</small>' : '');
    return '<g class="pkt" data-tip="' + sik(t) + '" onmouseover="kurveHover(this,1)" onmouseout="kurveHover(this,0)">' +
      '<rect x="' + (x(i,a.length)-bredde/2) + '" y="0" width="' + bredde + '" height="' + (H-bund) + '" fill="transparent"/>' +
      '<line x1="' + x(i,a.length) + '" y1="' + pv + '" x2="' + x(i,a.length) + '" y2="' + (H-bund) + '" stroke="#6C47FF" stroke-dasharray="3 3" opacity="0"/>' +

      '<circle cx="' + x(i,a.length) + '" cy="' + (pv+2) + '" r="6" fill="#EC4899"/>' +
      '<text x="' + x(i,a.length) + '" y="' + (pv+6) + '" font-size="9" fill="#fff" text-anchor="middle" font-weight="800">!</text></g>';
  }).join('');
  return '<div class="kurve-boks"><svg viewBox="0 0 ' + B + ' ' + H + '">' +
    '<defs><linearGradient id="gk" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#6C47FF" stop-opacity=".2"/><stop offset="100%" stop-color="#6C47FF" stop-opacity="0"/></linearGradient></defs>' +
    net + datoer + (b.length > 1 ? '<path d="' + sti(b) + '" fill="none" stroke="#C9C2E8" stroke-width="2" stroke-dasharray="5 5" stroke-linecap="round"/>' : '') +

      '<span><span style="display:inline-block;width:14px;height:2.6px;background:#6C47FF;vertical-align:middle;border-radius:2px"></span> Denne periode</span>' +
      (b.length > 1 ? '<span><span style="display:inline-block;width:14px;height:2px;background:repeating-linear-gradient(90deg,#C9C2E8 0 4px,transparent 4px 8px);vertical-align:middle"></span> Perioden før</span>' : '') +
      ((noter||[]).length ? '<span><span style="display:inline-block;width:8px;height:8px;border-radius:50%;background:#EC4899;vertical-align:middle"></span> Note</span>' : '') +

/* ══ OVERSIGT ══ */
/* Perioden som tekst ud fra backendens felter (type, visning, fra, til, klokke):
   "I dag, 6. okt., til kl. 15.57", "I går, 5. okt.", "Seneste 28 dage, 8. sep. til 5. okt." eller "8. sep. til 5. okt., 28 dage". */
function periodeTekst(d) {
  if (!d) return '';
  const type = d.type || (d.timer ? (dage === 'igaar' ? 'igaar' : 'idag') : d.egne ? 'egne' : 'dage');
  const fraTil = d.fra && d.til ? (d.fra === d.til ? datoDk(d.fra) : datoDk(d.fra) + ' til ' + datoDk(d.til)) : '';
  if (type === 'idag') return 'I dag' + (d.fra ? ', ' + datoDk(d.fra) : '') + (d.klokke ? ', til kl. ' + d.klokke : '');
  if (type === 'igaar') return 'I går' + (d.fra ? ', ' + datoDk(d.fra) : '');
  if (type === 'egne') return fraTil + (d.dage ? ', ' + d.dage + (d.dage === 1 ? ' dag' : ' dage') : '');
  // det gamle svar havde hverken type, visning eller dage; så bruges knappen
  const n = d.dage || ({ '7d':7, '28d':28, '90d':90, '365d':365 })[dage];
  const navn = d.visning || (n ? 'Seneste ' + n + ' dage' : '');
  return navn + (navn && fraTil ? ', ' : '') + fraTil;
}
/* Grøn eller gul linje om, hvor Oversigtens tal kommer fra. I dag: "live". I går og længere: aldrig "live". */

      (d.fraHvornaar && Date.now() - new Date(d.fraHvornaar).getTime() < 24*3600000 ? ' Tælleren startede ' + datoTidDk(d.fraHvornaar) + '.' : '') + '</div>';

async function visOversigt(m) {

  const v = vaerktoej(periodevaelger());
  m.innerHTML = hoved('Oversigt','Hvordan går det med siden', v) + skeletKort(4);
  const d = await kald('oversigt', { dage });
  const idag = d.type ? d.type === 'idag' : dage === '24t';
  const maalVises = d.maal && !mangler(d.maal.nu);

/* Hvornår på døgnet: én søjle pr. time i talrækkefølge 00 til 23 (Google sorterer timerne som tekst:
   0, 1, 10, 11 ...), og timer uden besøg står som 0. I dag stopper ved timen nu (dansk tid), så timer,
   der ikke er kommet endnu, ikke står som 0. null (rapporten fejlede) og [] sendes uændret videre. */
/* En time, backenden sender som null (fx fordi Google endnu ikke har talt den), forbliver null og vises som –.
   I dag: timer efter den sidste time med tal og frem til nu er ukendte (Google er nogle timer bagud), ikke 0. */
function doegnTimer(raekker, felt) {
  if (!Array.isArray(raekker) || !raekker.length) return raekker;
  const sum = Array(24).fill(undefined);
  let hoejst = 0, sidstMedTal = -1;
  raekker.forEach(r => { const h = Number(r.hour);
    if (!Number.isInteger(h) || h < 0 || h > 23) return;
    hoejst = Math.max(hoejst, h);
    if (mangler(r[felt])) { if (sum[h] === undefined) sum[h] = null; return; }
    sum[h] = (Number(sum[h]) || 0) + (Number(r[felt]) || 0); sidstMedTal = Math.max(sidstMedTal, h); });
  const idag = dage === '24t';
  const sidste = idag ? Math.max(hoejst, dkTime()) : 23;
  // en time uden række er 0 (Google sender ikke tomme timer), undtagen i dag efter den sidste time med tal
  return sum.slice(0, sidste + 1).map((n, h) => ({ hour: String(h), [felt]: n !== undefined ? n : idag && h > sidstMedTal ? null : 0 }));
}

/* Besøg og konverteringer er Google Analytics (kun cookie-ja). Forbrug er fra annoncekontoen (lige nu kun Meta) og kobles

  // og domain_click (klik fra fx Trustpilot). Backenden sorterer dem fra; filteret her er en ekstra sikring.
  const erKampagne = n => !!n && !/^\(.*\)$/.test(String(n).trim()) && String(n).trim() !== 'domain_click';
  const kamp = d.kampagner == null ? null : d.kampagner.filter(r => erKampagne(r.sessionCampaignName))
    .map(r => ({ ...r, vist: r.navn && r.navn !== r.sessionCampaignName ? r.navn : r.sessionCampaignName }));
  const ikke = Array.isArray(d.ikkeKampagner) ? d.ikkeKampagner
    : (d.kampagner || []).filter(r => !erKampagne(r.sessionCampaignName)).map(r => ({ sessionCampaignName: r.sessionCampaignName, sessions: r.sessions }));
  const ind = d.indhold == null ? null : d.indhold.filter(r => !erUkendt(r.sessionManualAdContent));
  const kf = d.kildeFor || {}, daek = d.daekning;

  const pk = d.prisPrKonvertering || { nu: konv.nu && !mangler(d.samletForbrug) ? d.samletForbrug / konv.nu : null, grund: null };
  const forbrugGrund = mangler(d.samletForbrug) ? (d.forbrugGrund || (d.harForbrug ? 'Forbruget er ukendt.' : 'Ingen annoncekonto er koblet på.')) : '';
  const ukendtPris = (kamp || []).find(r => r.betalt !== false && mangler(r.forbrug) && r.forbrugGrund);

  const lille = t => '<p style="font-size:12px;color:var(--svag);margin-top:8px;line-height:1.6">' + t + '</p>';
  const platform = v => v === 'meta' ? 'Meta' : (v === 'googleads' || v === 'google') ? 'Google Ads' : sik(v || 'Ukendt');

/* Installationer fra butikkerne. Google Play er ofte flere dage bagud, så backenden siger, hvilke dage der har tal

   "ikke koblet på", indtil den er det. I dag og I går vises som de er, ikke som 7 dage. */
async function visDownloads(m) {
  const v = vaerktoej(periodevaelger());
  if (!opsat.appstore && !opsat.googleplay) {
    m.innerHTML = hoved('Downloads','Hvor mange installerede appen') +
      `<div class="besked advar">Hverken App Store Connect eller Google Play er koblet på. Det er de tal, I egentlig styrer efter,
       for målingen på siden stopper ved klik til butik. Se <b>Opsætning</b>.</div>`; return; }
  m.innerHTML = hoved('Downloads','Hvor mange installerede appen', v) + skeletKort(3);
  const d = await kald('downloads', { dage });
  const ialt = d.ialt || {};
  const appleKoblet = d.appleKoblet != null ? d.appleKoblet : opsat.appstore;
  const googleKoblet = d.googleKoblet != null ? d.googleKoblet : opsat.googleplay;
  const gD = d.daekning, aD = d.daekningApple;
  // alle dage står i tabellen; en dag, hvor ingen butik har tal (null), er ukendt og ikke 0
  const dageRk = (d.kurve||[]).map(r => ({ ...r, ialt: mangler(r.apple) && mangler(r.google) ? null : (Number(r.apple)||0) + (Number(r.google)||0) }));
  const kurve = dageRk.map(r => ({ date: String(r.dato).replace(/-/g,''), activeUsers: r.ialt }));
  const ikkeKoblet = '<span style="color:var(--svag);font-size:16px">ikke koblet på</span>';
  const senest = d.googleTil ? 'Seneste dag med tal fra Google Play: ' + punkt(datoDk(d.googleTil)) : '';
  m.innerHTML = hoved('Downloads', (d.googleTil && d.til && d.googleTil < d.til ? punkt(periodeTekst(d)) + ' Google Play har tal til og med ' + datoDk(d.googleTil) : periodeTekst(d)), v) + hentetLinje(d) + delfejl(d) +
    daekBesked(googleKoblet ? gD : null, senest && !/Seneste|til og med/.test((gD && gD.grund) || '') ? senest : '') +
    (d.googleNote ? '<div class="besked info">' + sik(d.googleNote) + ' Google lægger hver måneds tal ud med op til to ugers forsinkelse (septembers tal kom 4. oktober), så de seneste dage mangler altid her. De nyeste tal står i Play Console. Mangler tallene i mere end tre uger, så tjek adgangen.</div>' : '') +
    '<div class="net n3">' +
      kpi('Installationer i alt', TT(ialt.samlet), '', '', mangler(ialt.samlet) ? (gD && gD.grund) || 'Ingen butik har tal for perioden.' : '', ialt.samletTekst || '') +
      kpi('App Store', appleKoblet ? TT(ialt.apple) : ikkeKoblet, '', '', appleKoblet && mangler(ialt.apple) ? (aD && aD.grund) || '' : '',
        appleKoblet ? kildeTekst('appstore', aD) : 'Kobles på under Opsætning') +
      kpi('Google Play', googleKoblet ? TT(ialt.google) : ikkeKoblet, '', '', googleKoblet && (mangler(ialt.google) || (gD && gD.hel === false)) ? (gD && gD.grund) || '' : '',
        googleKoblet ? kildeTekst('play', gD) : 'Kobles på under Opsætning') + '</div>' +
    '<div class="kort" style="margin-bottom:14px"><h3>Installationer pr. dag</h3>' + kildeLinje(ialt.samletKilder && ialt.samletKilder.length ? (ialt.samletKilder.includes('App Store') ? ['play','appstore'] : 'play') : 'play', gD) +
      (kurve.filter(r => r.activeUsers != null).length > 1 ? storKurve(kurve, [], [], 'installationer')

    '<div class="kort"><h3>Installationer dag for dag' + udtrKnap('d-dage','downloads') + '</h3>' + kildeLinje(googleKoblet ? 'play' : 'appstore', gD) + tabel('d-dage', dageRk, [

  const kb = ekstra => kildeTekst(d.kilde || 'bot', null, [navn, ekstra].filter(Boolean).join(', '));
  const fbI = fb ? (Number(fb.up)||0) + (Number(fb.down)||0) : 0;

async function totpFjern() { try { await kald('totp-fjern', { kode: document.getElementById('t-kode').value }); flash('To-trins er slået fra', 'godt'); vis(); } catch (e) { flash(e.message, 'slem'); } }
async function gemBruger() { const navn = document.getElementById('u-navn').value.trim(), kode = document.getElementById('u-kode').value, rolle = document.getElementById('u-rolle').value;
  try { await kald('bruger-gem', { navn, kode, rolle }); flash(navn + ' kan nu logge ind', 'godt'); vis(); } catch (e) { flash(e.message, 'slem'); } }
async function skiftMinKode() { try { await kald('min-kode', { gammel: document.getElementById('k-gammel').value, ny: document.getElementById('k-ny').value });
  document.getElementById('k-gammel').value = ''; document.getElementById('k-ny').value = ''; flash('Din adgangskode er skiftet', 'godt'); } catch (e) { flash(e.message, 'slem'); } }
async function sletBruger(id) { if (!confirm('Fjern brugeren?')) return; try { await kald('bruger-slet', { id }); vis(); } catch (e) { flash(e.message, 'slem'); } }
async function opfrisk() { try { await kald('opfrisk'); flash('Næste visning henter friske tal fra Google', 'godt'); } catch (e) { flash(e.message, 'slem'); } }
async function testMail() { try { const s = await kald('test-mail'); flash('Prøvemail sendt til ' + s.til, 'godt'); } catch (e) { flash(e.message, 'slem'); } }

/* ── stilladset ── */
const hoved = (t, u, hoejre) => '<div class="top"><div><h1>' + t + '</h1><p>' + paaSiden(u) + '</p></div>' + (hoejre || '') + '</div>';
/* Nøgletalskort. tal er en færdig tekst; null, undefined og '' vises som –. grund er en kort forklaring
   (fx "Google Play har kun tal til 25. sep."), som står med lille skrift under tallet. */
const kpi = (navn, tal, aendring, sp, grund, kilde, advar) => '<div class="kort"><h3>' + navn + '</h3><div class="kpi-bund"><div><div class="tal">' +
  (mangler(tal) || tal === '' ? '–' : typeof tal === 'number' ? T(tal) : tal) + '</div>' +
  kortGrund(grund) + (advar ? '<div class="grund advar-tekst">' + sik(advar) + '</div>' : '') +
  (aendring ? '<div style="margin-top:5px">' + aendring + '</div>' : '') + '</div>' + (sp || '') + '</div>' +
  (kilde ? '<div class="kilde">' + sik(kilde) + '</div>' : '') + '</div>';
/* Nøgletal fra backenden som { nu, foer, kilde, grund, daekning? }. nu = null vises som –, foer = null giver ingen pil,
   og grund vises under tallet. form formaterer (T, pct, tid, kr ...), vendt = true når lavere er bedre.
   Kilden står med lille grå skrift nederst, med tallets egen dækning, når det har én (fx klik-tælleren,
   der startede senere end besøgstælleren); ekstra er en kort tekst efter kilden. advar er en gul advarsel under tallet. */
const kpiTal = (navn, x, form, vendt, sp, ekstra, advar) => { x = x || {};
  return kpi(navn, TT(x.nu, form), pil(x.nu, x.foer, vendt, form, x.grund ? '' : undefined), sp, x.grund, kildeTekst(x.kilde, x.daekning || null, ekstra), advar); };
const udtrKnap = (id, filnavn) => '<button class="ret knap grim lille" onclick="udtraek(\'' + id + '\',\'' + filnavn + '\')">Hent som CSV</button>';
function flash(t, slags) { document.querySelectorAll('.flash').forEach(e => e.remove());
  const d = document.createElement('div'); d.className = 'besked flash ' + slags; d.textContent = t;
  d.style.cssText = 'position:fixed;bottom:22px;left:50%;transform:translateX(-50%);z-index:200;box-shadow:0 12px 44px rgba(20,19,42,.2);margin:0';
  document.body.appendChild(d); setTimeout(() => d.remove(), 3400); }
function tegnNav() { let ud = '', g = '';
  synligeSider().forEach(s => { if (s.gruppe !== g) { ud += '<div class="nav-mrk">' + s.gruppe + '</div>'; g = s.gruppe; }
    ud += '<button class="' + (side===s.id?'valgt':'') + '" onclick="gaaTil(\'' + s.id + '\')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="' + s.ikon + '"/></svg>' + s.navn + '</button>'; });
  document.getElementById('nav').innerHTML = ud;
  const h = document.getElementById('hvem');
  h.innerHTML = mig ? '<b>' + sik(mig.navn) + '</b><span class="rolle r-' + sik(mig.rolle) + '">' + ({laeser:'kan kigge',redigerer:'kan rette',ejer:'ejer'}[mig.rolle]||mig.rolle) + '</span>' : '';
}
function gaaTil(id) { side = id; location.hash = id; sidsteTabel = {}; vis(); }
async function vis() { if (skjult(side)) side = 'oversigt'; tegnNav(); const m = document.getElementById('main');
  const f = { oversigt:visOversigt, tragt:visTragt, trafik:visTrafik, soegeord:visSoegeord, annoncer:visAnnoncer, downloads:visDownloads,
              seo:visSeo, chat:visChat, blog:visBlog, links:visLinks, indhold:visIndhold, oppetid:visOppetid, opsaetning:visOpsaetning }[side] || visOversigt;
  try { await f(m); saetHjaelp(m); } catch (e) { m.innerHTML = hoved('Noget gik galt','') + '<div class="besked slem">' + sik(e.message) + '</div>'; } }
async function start() {
  document.getElementById('login').style.display = 'none'; document.getElementById('app').classList.add('vis');
  const st = await hentStatus();
  const pb = document.getElementById('proeve');
  if (st.proeve) { pb.style.display = 'block'; pb.textContent = 'PRØVEDATA. Alle tal på denne side er opdigtede og bruges kun til at vise udseendet. Ingen af dem er rigtige.'; }
  // databasen er afvist (fx DATABASE_URL fra den anden side): det skal ses med det samme, paa alle sider
  else if (opsat.database === false && opsat.databaseFejl) { pb.style.display = 'block'; pb.textContent = 'Databasen kan ikke bruges. ' + opsat.databaseFejl; }
  else pb.style.display = 'none';
  if (!mig) { try { mig = await kald('mig'); lager().setItem('vh-mig', JSON.stringify(mig)); } catch (e) {} }
  side = (location.hash || '').replace('#','') || 'oversigt'; if (!synligeSider().some(s => s.id === side)) side = 'oversigt';
  vis(); hentLive(); if (liveUr) clearInterval(liveUr); liveUr = setInterval(hentLive, 60000);
}
window.addEventListener('hashchange', () => { const h = (location.hash || '').replace('#',''); if (h && h !== side && synligeSider().some(s => s.id === h)) { side = h; sidsteTabel = {}; vis(); } });
// status hentes med det samme, saa login-skaermen viser den rigtige side
hentStatus();
if (seddel) start(); else document.getElementById('navn').focus();

</script>
