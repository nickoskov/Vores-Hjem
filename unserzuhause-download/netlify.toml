plugins = []

[functions]

  [functions."*"]

[build]

  [build.environment]

  [build.processing]

    [build.processing.css]

    [build.processing.html]

    [build.processing.images]

    [build.processing.js]

  [build.services]

[[headers]]
for = "/*"

  [headers.values]
  X-Content-Type-Options = "nosniff"
  Referrer-Policy = "strict-origin-when-cross-origin"
  X-Frame-Options = "DENY"
  Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=()"

[[headers]]
for = "/fonts/*"

  [headers.values]
  Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
for = "/*.mp4"

  [headers.values]
  Cache-Control = "public, max-age=604800"

[[headers]]
for = "/*.webp"

  [headers.values]
  Cache-Control = "public, max-age=604800"

[[headers]]
for = "/*.png"

  [headers.values]
  Cache-Control = "public, max-age=604800"

# Den gamle Netlify-adresse (bio-links paa Instagram og TikTok) sendes videre til jeres eget domaene.
# Proeveudgaver (<id>--unserzuhause-download.netlify.app) rammes ikke.
[[redirects]]
from = "https://unserzuhause-download.netlify.app/*"
to = "https://download.unserzuhauseapp.de/:splat"
status = 301
force = true
